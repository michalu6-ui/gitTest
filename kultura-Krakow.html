<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kultura Krakowa - Wawel</title>
	<style>
		:root { color-scheme: light; --ink: #243447; --brick: #5d2724; --paper: #f4f1ec; --white: #fff; }
		* { box-sizing: border-box; }
		body { margin: 0; font-family: Arial, sans-serif; line-height: 1.6; color: var(--ink); background: var(--paper); }
		header { padding: 70px 20px; text-align: center; color: var(--white); background: linear-gradient(135deg, #5d2724, #b9794d); }
		header h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 4rem); }
		nav { margin-top: 24px; }
		nav a { display: inline-block; margin: 5px; padding: 10px 18px; border: 1px solid rgba(255,255,255,.75); border-radius: 6px; color: var(--white); text-decoration: none; }
		nav a:hover { background: rgba(255,255,255,.15); }
		main { max-width: 900px; margin: 0 auto; padding: 45px 20px; }
		section { padding: 30px; background: var(--white); border-radius: 12px; box-shadow: 0 8px 24px rgba(31,43,52,.13); }
		h2 { margin-top: 0; color: var(--brick); }
		.button { display: inline-block; padding: 12px 18px; border-radius: 6px; color: var(--white); background: var(--brick); text-decoration: none; font-weight: bold; }
		footer { margin-top: 20px; padding: 22px; text-align: center; color: var(--white); background: var(--brick); }
	</style>
</head>
<body>
	<header><h1>Kultura Krakowa</h1><p>Kategoria prowadząca do najważniejszego zabytku miasta.</p><nav aria-label="Główna nawigacja"><a href="Kraków.html">Wróć do Krakowa</a><a href="index.html">Strona główna</a></nav></header>
	<main><section><h2>Wawel</h2><p>Wawel jest jednym z najważniejszych symboli Krakowa i wyjątkowym centrum polskiej historii, sztuki oraz dziedzictwa królewskiego.</p><a class="button" href="wawel.html">Przejdź do Wawelu</a></section></main>
	<footer>Kultura Krakowa • Wawel</footer>
</body>
</html>
